spring:
  config:
    activate:
      on-profile: test
  # 테스트 환경에는 실제 브로커가 없다. 프로듀서가 메타데이터를 못 가져와도 max.block.ms 만큼만
  # 기다리고 실패하도록(기본값 60s는 테스트를 그만큼 지연시킬 수 있다) 짧게 잡고,
  # 컨슈머는 아예 폴링을 시작하지 않도록 auto-startup 을 끈다.
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      properties:
        max.block.ms: 2000
    listener:
      auto-startup: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
            scope:
              - profile_nickname
          naver:
            client-id: test-naver-client-id
            client-secret: test-naver-client-secret
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Naver
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: 44nBmBw3lc0Oquwqj8hhYoNa3tSAkXhj9tnGDclZOVC
  access-token-validity-ms: 1800000
  refresh-token-validity-ms: 1209600000
  temp-token-validity-ms: 600000

