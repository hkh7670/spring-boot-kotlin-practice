  secret: oeC2FyMLLRtBSrEZyOkd9m0Hz37YrcsdVCtXw5OIUjc=
  init-vector: iOewR3NHE1qYUsp/qQitOA==

toss:
  payments:
    secret-key: test_sk_dummy

redis:
  host: localhost
  port: 6379
  password: test-redis-password

app:
  oauth:
    frontend-success-redirect-uri: http://localhost:8080/oauth/complete
    frontend-failure-redirect-uri: http://localhost:8080/oauth/error
  log:
    dir: ./logs
    level: INFO
    max-history: 7
